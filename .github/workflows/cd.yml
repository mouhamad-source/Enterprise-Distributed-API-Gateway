name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/gateway
  KUBE_NAMESPACE: production

jobs:
  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./src/Gateway
        file: ./deployment/docker/Dockerfile.gateway
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f ./deployment/k8s/namespace.yaml
        kubectl apply -f ./deployment/k8s/gateway-deployment.yaml
        kubectl apply -f ./deployment/k8s/gateway-service.yaml
        kubectl apply -f ./deployment/k8s/redis-deployment.yaml
        kubectl apply -f ./deployment/k8s/userservice-deployment.yaml

    - name: Verify Deployment
      run: |
        kubectl rollout status deployment/gateway -n ${{ env.KUBE_NAMESPACE }} --timeout=5m

    - name: Health Check
      run: |
        kubectl port-forward service/gateway 8080:80 -n ${{ env.KUBE_NAMESPACE }} &
        sleep 10
        curl --fail http://localhost:8080/health || exit 1
        pkill -f "kubectl port-forward"

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
    - name: Send Notification
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {
            "text": "Deployment Status: ${{ needs.deploy.result }}\nCommit: ${{ github.sha }}\nEnvironment: Production"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}